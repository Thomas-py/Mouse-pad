name: iOS build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"

jobs:
  build-unsigned:
    name: Build (simulador, sin firmar)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar RemotePad.xcodeproj
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Build para simulador
        working-directory: ios
        run: |
          xcodebuild build \
            -project RemotePad.xcodeproj \
            -scheme RemotePad \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Tests unitarios (GestureEngine, etc.)
        working-directory: ios
        run: |
          xcodebuild test \
            -project RemotePad.xcodeproj \
            -scheme RemotePad \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            CODE_SIGNING_ALLOWED=NO

  # Build firmado + .ipa instalable en el iPhone real. Requiere que Thomas
  # haya cargado los GitHub Secrets descritos en docs/SIDELOAD.md:
  #   APPLE_TEAM_ID, APPLE_CERTIFICATE_P12 (base64), APPLE_CERTIFICATE_PASSWORD,
  #   APPLE_PROVISIONING_PROFILE (base64)
  # Sin esos secrets este job se salta solo (no rompe el build del PR).
  build-signed-device:
    name: Build firmado (iPhone) + .ipa
    needs: build-unsigned
    # "secrets" no es un contexto válido en jobs.<job_id>.if (GitHub Actions lo
    # rechaza con "Invalid workflow file"). El chequeo de secrets se hace en el
    # primer step (id: guard) y los demás steps miran su output.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - name: Verificar que los secrets de firma estén cargados
        id: guard
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ] || [ -z "$APPLE_PROVISIONING_PROFILE" ]; then
            echo "::notice::Secrets de firma (APPLE_CERTIFICATE_P12 / APPLE_PROVISIONING_PROFILE) no configurados todavía — ver docs/SIDELOAD.md. Este job no hace nada por ahora."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - name: Instalar XcodeGen
        if: steps.guard.outputs.skip != 'true'
        run: brew install xcodegen

      - name: Generar RemotePad.xcodeproj
        if: steps.guard.outputs.skip != 'true'
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Importar certificado y provisioning profile
        if: steps.guard.outputs.skip != 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/remotepad-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/

          PROFILE_UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            | plutil -extract UUID xml1 -o - - \
            | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Build + archive firmado
        if: steps.guard.outputs.skip != 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: ios
        run: |
          xcodebuild archive \
            -project RemotePad.xcodeproj \
            -scheme RemotePad \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/RemotePad.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"

      - name: Exportar .ipa
        if: steps.guard.outputs.skip != 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: ios
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RemotePad.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Subir .ipa como artifact
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RemotePad-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 7
