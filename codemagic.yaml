workflows:
  ios-unsigned-build:
    name: RemotePad — build sin firmar + tests
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Instalar XcodeGen
        script: brew install xcodegen

      - name: Generar RemotePad.xcodeproj
        script: |
          cd ios
          xcodegen generate --spec project.yml

      - name: Build para simulador (sin firmar)
        script: |
          cd ios
          xcodebuild build \
            -project RemotePad.xcodeproj \
            -scheme RemotePad \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Tests unitarios (GestureEngine, etc.)
        script: |
          cd ios
          xcodebuild test \
            -project RemotePad.xcodeproj \
            -scheme RemotePad \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            CODE_SIGNING_ALLOWED=NO

      # Sin firmar, para dispositivo real (arm64, no simulador). Thomas no
      # tiene cuenta paga de Apple Developer (esa es la única forma de generar
      # certificados desde la web de developer.apple.com) así que la firma la
      # hace Sideloadly localmente con su Apple ID gratis al momento de
      # instalar — acá solo generamos el .ipa sin firmar que Sideloadly toma
      # como entrada. Ver docs/SIDELOAD.md.
      - name: Build sin firmar para el iPhone (.ipa para Sideloadly)
        script: |
          cd ios
          xcodebuild build \
            -project RemotePad.xcodeproj \
            -scheme RemotePad \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          cd build/Build/Products/Release-iphoneos
          mkdir Payload
          cp -R RemotePad.app Payload/
          zip -r "$CM_BUILD_DIR/ios/RemotePad-unsigned.ipa" Payload

    artifacts:
      - ios/RemotePad-unsigned.ipa
